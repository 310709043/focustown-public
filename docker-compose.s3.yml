# Override file that swaps the local-filesystem storage backend for MinIO
# (an S3-compatible single-binary service). Use with:
#
#     docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d
#
# Why the dual endpoint setup: presigned URLs minted from inside the cluster
# need a Host the browser can reach. boto3 signs the URL using the client's
# endpoint_url, and MinIO does not include the Host header in its signing
# scope, so we hand the backend two URLs — minio:9000 for in-cluster PUT,
# localhost:9000 for the presigned GETs that the <audio> element follows.

services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (browse buckets at http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # Pin the URL embedded in presigned links so they're reachable from
      # the host browser (not just from inside the docker network).
      MINIO_SERVER_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    environment:
      - STORAGE_BACKEND=s3
      - S3_BUCKET=${S3_BUCKET:-focustown-dev}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  miniodata:
