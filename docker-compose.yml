services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focustown}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focustown}
      POSTGRES_DB: ${POSTGRES_DB:-focustown}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focustown}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local_jwt}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TTL_MIN=${JWT_ACCESS_TTL_MIN:-30}
      - JWT_REFRESH_TTL_DAYS=${JWT_REFRESH_TTL_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./backend
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
      - NEXT_PUBLIC_MEDIA_ALLOWED_ORIGINS=${NEXT_PUBLIC_MEDIA_ALLOWED_ORIGINS:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    # `:cached` is a Docker Desktop hint (macOS / Windows / WSL2) meaning
    # "host is the source of truth, in-container reads may be slightly
    # delayed". Without it, every stat() call (Next.js dev polls a lot of
    # files) round-trips between host and VM and dominates HMR latency.
    # node_modules + .next stay on named volumes so they're not pulled
    # across the host boundary at all and persist across container
    # recreations.
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    command: ["pnpm", "dev"]

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next_cache:
