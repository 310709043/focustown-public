name: Build & push ECR images

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/lowbatterytown-backend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/lowbatterytown-backend:latest
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/lowbatterytown-backend:cache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/lowbatterytown-backend:cache,mode=max

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        env: [prod, dev]
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: meta
        run: |
          SHORT="${GITHUB_SHA::12}"
          echo "image_tag=${SHORT}-${{ matrix.env }}" >> "$GITHUB_OUTPUT"

      - name: Resolve public host
        id: host
        run: |
          if [[ "${{ matrix.env }}" == "prod" ]]; then
            echo "host=${{ vars.PROD_PUBLIC_HOST }}" >> "$GITHUB_OUTPUT"
          else
            echo "host=${{ vars.DEV_PUBLIC_HOST }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_* env vars are baked into the JS bundle at `pnpm build`
      # time (see frontend/Dockerfile lines 27-32). The CSP media-src list
      # must include every host the backend can redirect <audio> requests
      # to — that's the public host (where /api/v1/tracks/.../stream is
      # served) plus the regional S3 endpoint (where the backend 302s
      # presigned URLs). path-style addressing means the bucket name is in
      # the URL path, not the hostname, so we don't have to template
      # S3_BUCKET into the allow-list. Both `s3.<region>` and `s3-<region>`
      # variants exist depending on the AWS region; allow-listing both
      # avoids region-specific surprises.
      - name: Build & push frontend (${{ matrix.env }})
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/lowbatterytown-frontend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/lowbatterytown-frontend:latest-${{ matrix.env }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ steps.host.outputs.host }}
            NEXT_PUBLIC_WS_BASE_URL=wss://${{ steps.host.outputs.host }}
            NEXT_PUBLIC_SITE_URL=https://${{ steps.host.outputs.host }}
            NEXT_PUBLIC_MEDIA_ALLOWED_ORIGINS=https://${{ steps.host.outputs.host }},https://audio.lowbatterytown.com,https://broadcast.lowbatterytown.com
            NEXT_PUBLIC_BROADCAST_PROXY_BASE_URL=https://broadcast.lowbatterytown.com
            NEXT_PUBLIC_ADSENSE_PUB_ID=${{ vars.ADSENSE_PUB_ID }}
            NEXT_PUBLIC_GA_ID=${{ vars.GA_ID }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/lowbatterytown-frontend:cache-${{ matrix.env }}
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/lowbatterytown-frontend:cache-${{ matrix.env }},mode=max

  caddy:
    # Custom caddy image bakes the repo-root Caddyfile in, since LCS has no
    # volume mounts and the upstream caddy:2-alpine ships a default config
    # that doesn't know about our /api/* + /healthz routes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build & push caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/lightsail/caddy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/lowbatterytown-caddy:${{ steps.meta.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/lowbatterytown-caddy:latest
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/lowbatterytown-caddy:cache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/lowbatterytown-caddy:cache,mode=max
