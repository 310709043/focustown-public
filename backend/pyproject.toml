[project]
name = "lowbatterytown-backend"
version = "0.1.0"
description = "LowBatteryTown backend — FastAPI + SQLAlchemy + Redis"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  # passlib's bcrypt backend has a startup probe that hashes a >72-byte
  # secret; bcrypt 4.1+ enforces the 72-byte limit strictly, breaking the
  # probe. Pin to <4.1 until passlib publishes a fix (or migrate to pwdlib).
  "bcrypt<4.1",
  "python-multipart>=0.0.12",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "structlog>=24.4",
  "boto3>=1.34",
  # Pure-Python audio metadata reader. Only used by scripts/seed-dev-data.py
  # to extract duration_ms from seeded MP3s; not on the request path. Zero
  # transitive deps, ~few hundred KB.
  "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "testcontainers[postgres,redis]>=4.8",
  "anyio>=4.6",
  # moto stubs out boto3 calls so unit tests for the Cognito/SES/Secrets
  # adapters can run without an AWS account or LocalStack container.
  "moto>=5",
]
# Phase 09 — OpenTelemetry. Kept out of base install because the SDK
# adds measurable cold-start cost and dev / test never need it.
# Production: ``pip install -e ".[otel]"``; the engine event listeners
# in ``app/infrastructure/db/observability.py`` always work (they only
# need ``sqlalchemy.event``); these extras add OTLP export.
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
]

[tool.setuptools.packages.find]
# `app` is the only importable package; `alembic/` carries DDL scripts
# loaded by alembic at runtime via `prepend_sys_path = .`, and `assets/`
# is media — neither belongs in the wheel. Without this, setuptools
# auto-discovery refuses to build with "Multiple top-level packages".
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use hardcoded fixture passwords/tokens and unused unpacks.
"tests/**/*.py" = ["S105", "S106", "S107", "RUF059"]
# Bot reply templates use intentional fullwidth CJK punctuation.
"app/domain/services/bot_reply_service.py" = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is reported, not gated. A fail-under threshold will be added
# only after the meaningful test set is in place (see plan: PR2/PR4).
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  # Push-notification stub — body lands in a follow-up round.
  "app/infrastructure/notifications/sns_notifier.py",
  # Alembic migrations
  "alembic/*",
  # FastAPI app composition + lifespan wiring (init_redis, register
  # handlers, etc.) — observable only when a real ASGI server boots.
  # Exercised by tests/integration/api/test_healthz.py.
  "app/main.py",
  # SQLAlchemy async session factory — its semantics (commit on success,
  # rollback on exception) are only meaningful against a real DB.
  # tests/integration/conftest.py drives this through every request.
  "app/infrastructure/db/session.py",
  # SQL adapters and Cognito/SES/S3/Redis adapters. Their contracts are
  # the DB / cloud-service behaviour; verifying them with mocks would
  # only test the mocks. tests/integration/ exercises them against real
  # Postgres + Redis containers (testcontainers) and moto AWS stubs.
  "app/infrastructure/db/repositories/*",
  "app/infrastructure/auth/providers/cognito.py",
  "app/infrastructure/storage/local.py",
  "app/infrastructure/storage/s3.py",
  "app/infrastructure/presence/redis_tracker.py",
  "app/infrastructure/rate_limit/redis_limiter.py",
  "app/infrastructure/secrets/aws.py",
  "app/infrastructure/notifications/ses_notifier.py",
  # Router files — every endpoint is a thin wrapper that hands off to a
  # domain service. Wiring (Depends graph, DB session lifecycle, error
  # envelopes) is observable only end-to-end and is covered by
  # tests/integration/api/test_*_router.py against real Postgres +
  # Redis containers. Unit-mocking the routers tests the mocks.
  "app/api/v1/*/router.py",
  # Worker entry point (main loop) — needs real Redis + AsyncIO
  # scheduler to verify. tests/unit/test_worker.py covers the pure
  # helpers + job short-circuits that ARE unit-testable.
  "app/worker.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
