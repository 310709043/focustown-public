[project]
name = "focustown-backend"
version = "0.1.0"
description = "Focus Town backend — FastAPI + SQLAlchemy + Redis"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  # passlib's bcrypt backend has a startup probe that hashes a >72-byte
  # secret; bcrypt 4.1+ enforces the 72-byte limit strictly, breaking the
  # probe. Pin to <4.1 until passlib publishes a fix (or migrate to pwdlib).
  "bcrypt<4.1",
  "python-multipart>=0.0.12",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "testcontainers[postgres,redis]>=4.8",
  "anyio>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use hardcoded fixture passwords/tokens and unused unpacks.
"tests/**/*.py" = ["S105", "S106", "S107", "RUF059"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
