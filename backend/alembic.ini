[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally blank — env.py overrides it from
# settings.database_url at runtime and (for APP_ENV=production) appends
# `ssl=require` for RDS. Hardcoding a default here was misleading for new
# operators and tempted folks to point migrations at the wrong DB.
sqlalchemy.url =
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
